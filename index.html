<style>
/* Launcher: a white gallery of the seven directions. Each tile expands into its page. */
:root{--page:#FFFFFF;--tile:#F4F4F2;--tile-h:#EEEEEB;--ink:#141A14;--sub:#6B6F69;--g:12px;--r:20px}
@view-transition{navigation:auto}
body{background:var(--page);color:var(--ink)}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));container-type:inline-size}
.hd{display:flex;align-items:center;gap:10px;height:64px;font-size:13px;color:var(--sub)}
.hd svg{height:13px;width:auto;display:block;color:var(--ink)}
.hd .sl{opacity:.5}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--g);grid-auto-rows:calc((100cqw - 2 * var(--g)) / 60);grid-auto-flow:dense;padding-bottom:24px}
.t{grid-column:var(--c);grid-row:span var(--s);padding-bottom:var(--g);display:block;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.st{position:relative;display:flex;align-items:center;justify-content:center;height:100%;padding-bottom:40px;box-sizing:border-box;border-radius:var(--r);background:var(--tile);overflow:hidden;transition:background-color var(--t-ui) var(--ease-out),transform var(--t-press) var(--ease-out)}
.t:active .st{transform:scale(.98)}
.t:focus-visible{outline:none}
.t:focus-visible .st{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--ink)}
/* the desktop first screen inside each tile; tall tiles give it more air */
.ob{position:relative;display:block;overflow:hidden;background:#ddd;box-shadow:0 1px 2px rgba(20,26,20,.06),0 18px 36px -18px rgba(20,26,20,.32);transition:transform var(--t-ui) var(--ease-out),opacity var(--t-ui) var(--ease-out)}
.ob::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(20,26,20,.07);pointer-events:none}
.ob img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.ob{width:76%;aspect-ratio:16/10;border-radius:6px}
.nm{position:absolute;left:12px;bottom:12px;padding:7px 11px;border-radius:999px;background:var(--page);font-size:12px;font-weight:500;line-height:1;letter-spacing:.005em;color:var(--ink);box-shadow:0 1px 2px rgba(20,26,20,.08)}
@media (hover:hover){
  .t:hover .st{background:var(--tile-h)}
  .t:hover .ob{transform:scale(1.03)}
}
.away .ob{opacity:0;transform:scale(.97);transition:none}
/* expand overlay */
.xp{position:fixed;inset:0;z-index:100;pointer-events:none}
.xp-st{position:absolute;inset:0;background:var(--tile)}
.xp-pg{position:absolute;inset:0;opacity:0}
.xp-ob{position:absolute;margin:0;box-shadow:0 1px 2px rgba(20,26,20,.06),0 18px 36px -18px rgba(20,26,20,.32)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.24s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@media (max-width:760px){
  :root{--g:10px;--r:16px}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hd{height:56px}
  .g{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:calc((100cqw - var(--g)) / 40)}
  .t{grid-column:var(--mc);grid-row:span var(--ms)}
  .st{padding-bottom:30px}
  .ob{width:74%;border-radius:4px}
  .nm{left:8px;bottom:8px;padding:6px 9px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}
</style>
</head>

<script>
/* Tile → page: the tile's grey stage grows to fill the screen in the page's own colour, then the page opens.
   Coming back, the screen shrinks into the tile you left from. Visitor-triggered, so 300ms ease-out. */
(function () {
  var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EO = 'cubic-bezier(.16,1,.3,1)';
  var ss = { get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
             set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
             del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
  var grid = document.querySelector('.g');
  var tiles = [].slice.call(grid.querySelectorAll('.t'));
  var busy = false;
  var FULL = 'inset(0px 0px 0px 0px round 0px)';
  function inset(r) {
    var rad = getComputedStyle(document.documentElement).getPropertyValue('--r').trim() || '20px';
    return 'inset(' + r.top + 'px ' + (innerWidth - r.right) + 'px ' + (innerHeight - r.bottom) + 'px ' + r.left + 'px round ' + rad + ')';
  }
  function overlay(bg) {
    var x = document.createElement('div'); x.className = 'xp'; x.setAttribute('aria-hidden', 'true');
    x.innerHTML = '<div class="xp-st"><div class="xp-pg"></div></div>';
    x.querySelector('.xp-pg').style.background = bg;
    document.body.appendChild(x); return x;
  }

  grid.addEventListener('click', function (e) {
    var a = e.target.closest('a.t');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    ss.set('iconec-y', String(window.scrollY)); ss.set('iconec-from', a.getAttribute('data-slug'));
    if (rm) return;
    e.preventDefault(); if (busy) return; busy = true;
    var st = a.querySelector('.st'), ob = a.querySelector('.ob');
    var r = st.getBoundingClientRect(), ro = ob.getBoundingClientRect();
    var x = overlay(a.getAttribute('data-bg'));
    var clone = ob.cloneNode(true); clone.className = 'ob xp-ob';
    clone.style.cssText = 'left:' + ro.left + 'px;top:' + ro.top + 'px;width:' + ro.width + 'px;height:' + ro.height + 'px;border-radius:' + getComputedStyle(ob).borderRadius;
    x.appendChild(clone);
    a.classList.add('away');
    var dx = (innerWidth / 2 - (ro.left + ro.width / 2)) * .3, dy = (innerHeight / 2 - (ro.top + ro.height / 2)) * .3;
    x.firstChild.animate([{ clipPath: inset(r) }, { clipPath: FULL }], { duration: 300, easing: EO, fill: 'forwards' });
    x.querySelector('.xp-pg').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: 100, easing: EO, fill: 'forwards' });
    clone.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1.05)', opacity: 0 }], { duration: 220, easing: EO, fill: 'forwards' });
    setTimeout(function () { location.href = a.href; }, 300);
  });

  /* back from a page: shrink into the tile it came from */
  function back(x) {
    tiles.forEach(function (t) { t.classList.remove('away'); });
    var slug = ss.get('iconec-from'); ss.del('iconec-from');
    var a = slug && grid.querySelector('[data-slug="' + slug + '"]');
    if (!a || rm) { if (x) x.remove(); return !!a; }
    if (x) x.querySelectorAll('.xp-ob').forEach(function (n) { n.remove(); });
    else x = overlay(a.getAttribute('data-bg'));
    x.querySelector('.xp-pg').getAnimations().forEach(function (an) { an.cancel(); });
    x.firstChild.getAnimations().forEach(function (an) { an.cancel(); });
    a.classList.add('away');
    var r = a.querySelector('.st').getBoundingClientRect();
    x.querySelector('.xp-pg').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: EO, fill: 'forwards' });
    x.firstChild.animate([{ clipPath: FULL }, { clipPath: inset(r) }], { duration: 300, easing: EO, fill: 'forwards' })
      .finished.then(function () { a.classList.remove('away'); x.remove(); });
    return true;
  }
  var y = parseInt(ss.get('iconec-y') || '0', 10);
  if (ss.get('iconec-from') && y) { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; window.scrollTo(0, y); }
  if (!back(null) && !rm) {
    tiles.forEach(function (t, i) {
      t.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: i * 40, easing: EO, fill: 'backwards' });
    });
  }
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    busy = false;
    back(document.querySelector('.xp'));
  });
})();
</script>
